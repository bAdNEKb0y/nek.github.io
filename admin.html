<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1411">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FdP Admin">
<meta name="robots" content="noindex">
<title>Admin · Foot de Poche</title>
<link rel="manifest" href="admin.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:wght@600;800&family=Barlow:wght@400;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body class="adminpage">
<div id="app">
  <section id="adLogin" class="ad-login" hidden>
    <form class="card authcard" id="adForm" novalidate>
      <div class="kicker">Foot de Poche</div>
      <h1 class="ad-h1">PANEL <span>ADMIN</span></h1>
      <label for="aName">Pseudo</label>
      <input id="aName" autocomplete="username" maxlength="16" spellcheck="false" autocapitalize="off">
      <label for="aPass">Mot de passe</label>
      <input id="aPass" type="password" autocomplete="current-password" maxlength="72">
      <p class="err" id="aErr" role="alert"></p>
      <button class="btn primary" type="submit" id="aGo">Se connecter</button>
      <p class="hint">Même compte que dans le jeu. Seuls les comptes admin peuvent entrer.</p>
    </form>
  </section>
  <div id="admin" class="ad-page" hidden></div>
  <div class="toast" id="toast" role="status"></div>
</div>
<script type="module" src="admin-main.js"></script>
</body>
</html>
